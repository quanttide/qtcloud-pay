[package]
name = "qtcloud-pay-cli"
version = "0.1.0"
edition = "2021"
description = "量潮支付账本核心命令行工作台（qtcloud-pay CLI）"
license = "Apache-2.0"

[[bin]]
name = "qtcloud-pay"
path = "src/main.rs"

[lib]
name = "qtcloud_pay_cli"
path = "src/lib.rs"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
colored = "2"
csv = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tabled = "0.16"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
